plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'com.example.createheated'

base {
    archivesName = 'create_heated'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version
    mods {
        create_heated {
            sourceSet sourceSets.main
        }
    }
}
